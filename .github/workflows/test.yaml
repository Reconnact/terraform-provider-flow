name: tests

on:
  pull_request:
    paths-ignore:
      - 'README.md'
  # only the default branch — a branch with an open pull request would otherwise
  # run the whole suite twice against the same organisation
  push:
    branches:
      - master
    paths-ignore:
      - 'README.md'

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_flow_token: ${{ steps.detect_flow_token.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
      - run: go mod download
      - run: go build -v .
      - name: detect flow token
        id: detect_flow_token
        run: |
          if [ -n "${{ secrets.FLOW_TOKEN }}" ]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

  generate:
    name: generate docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
      - run: go generate ./...
      - name: git diff
        run: |
          git diff --compact-summary --exit-code || \
            (echo; echo "Unexpected difference in directories after code generation. Run 'go generate ./...' command and commit."; exit 1)

  test:
    name: terraform provider acceptance tests
    needs: build
    if: ${{ vars.RUN_ACCEPTANCE_TESTS == 'true' && needs.build.outputs.has_flow_token == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: acceptance-tests-${{ github.repository }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      # one matrix job at a time — both run the whole suite against the same org, and
      # two billable creates for one org race in the api's metrics table
      max-parallel: 1
      matrix:
        terraform:
          - '1.5.*'
          - '1.15.*'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false
      - run: go mod download
      - name: acceptance tests
        timeout-minutes: 40
        env:
          TF_ACC: "1"
          FLOW_TOKEN: ${{ secrets.FLOW_TOKEN }}
          FLOW_ENDPOINT_OVERRIDE: ${{ vars.FLOW_ENDPOINT }}
        run: |
          # only export it when it has a value — an empty FLOW_ENDPOINT is taken as the endpoint
          if [ -n "$FLOW_ENDPOINT_OVERRIDE" ]; then
            export FLOW_ENDPOINT="$FLOW_ENDPOINT_OVERRIDE"
          fi
          go test -v -cover -count=1 -timeout 30m ./...
