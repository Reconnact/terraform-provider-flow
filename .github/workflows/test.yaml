name: tests

on:
  pull_request:
    paths-ignore:
      - 'README.md'
  # only the default branch — a branch with an open pull request would otherwise
  # run the whole suite twice against the same organisation
  push:
    branches:
      - master
    paths-ignore:
      - 'README.md'

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      acceptance_configured: ${{ steps.detect_acceptance_config.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
      - run: go mod download
      - run: go build -v .
      # FLOW_TOKEN & FLOW_ENDPOINT have to be configured
      - name: detect acceptance test configuration
        id: detect_acceptance_config
        env:
          FLOW_TOKEN: ${{ secrets.FLOW_TOKEN }}
          FLOW_ENDPOINT: ${{ vars.FLOW_ENDPOINT }}
        run: |
          if [ -n "$FLOW_TOKEN" ] && [ -n "$FLOW_ENDPOINT" ]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
            echo "acceptance tests skipped: FLOW_TOKEN and the FLOW_ENDPOINT variable must both be set" >> "$GITHUB_STEP_SUMMARY"
          fi

  generate:
    name: generate docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
      - run: go generate ./...
      - name: git diff
        run: |
          git diff --compact-summary --exit-code || \
            (echo; echo "Unexpected difference in directories after code generation. Run 'go generate ./...' command and commit."; exit 1)

  test:
    name: terraform provider acceptance tests
    needs: build
    if: ${{ needs.build.outputs.acceptance_configured == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    concurrency:
      group: acceptance-tests-${{ github.repository }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      # one matrix job at a time — both run the whole suite against the same org, and
      # two billable creates for one org race in the api's metrics table
      max-parallel: 1
      matrix:
        terraform:
          - '1.11.*'
          - 'latest'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false
      - run: go mod download
      - name: acceptance tests
        timeout-minutes: 70
        env:
          TF_ACC: "1"
          FLOW_TOKEN: ${{ secrets.FLOW_TOKEN }}
          FLOW_ENDPOINT: ${{ vars.FLOW_ENDPOINT }}
        run: go test -v -cover -count=1 -timeout 60m ./...
